schema_version: 5
targets:
  T1:
    name: xbnf is a bootstrapped public Go module with spec, plan, CI, and a versioned CLI
    status: achieved
    value: 5.0
    cost: 3.0
    attestation: Repo https://github.com/marcelocantos/xbnf is public, default master, squash-only (allow_merge_commit=false). Apache-2.0 LICENSE. Commit 031f8e8 has spec, plan, examples, AGENTS.md, CLI --version/--help-agent. Local make test/vet/build green. CI run 33367560374 (push to master) build/vet/test passed.
    acceptance:
    - github.com/marcelocantos/xbnf exists, is public, default branch master, squash-only merges
    - LICENSE is Apache-2.0; README, AGENTS.md, agents-guide.md, and docs/plan.md are present
    - docs/xbnf.xbnf and docs/examples/*.xbnf are checked in
    - make test, make vet, and make build succeed; xbnf --version and --help-agent work
    - CI runs go build/vet/test on push and pull requests to master
    context: |-
      Clean-slate successor to arr-ai/wbnf. Bootstrap only: no engine yet. Language spec and work graph live under docs/.

      Achieved 2026-08-31: Repo https://github.com/marcelocantos/xbnf is public, default master, squash-only (allow_merge_commit=false). Apache-2.0 LICENSE. Commit 031f8e8 has spec, plan, examples, AGENTS.md, CLI --version/--help-agent. Local make test/vet/build green. CI run 33367560374 (push to master) build/vet/test passed.
    tags:
    - bootstrap
    - infra
    origin: 2026-02..05 wbnf design sessions; 2026-08-31 repo create
    discovered: 2026-08-31
    achieved: 2026-08-31
  T2:
    name: A grammar IR represents every construct in xbnf.xbnf
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - 'Go types in package grammar represent every construct in docs/xbnf.xbnf: rules, modifiers (#lex, #leaf), pragmas (#wrap, #import, #macro), stack/alt/seq, named terms, quantifiers including delimited repetition, directives, atoms (idents, strings, character classes, escapes, leaf /pat/, any-char, refs, extrefs, macros, lookahead, @, positional properties, grouping, empty)'
    - IR is constructed and inspected in tests without a parser (literal Go values)
    - No parse functions live in this package
    context: 'The engine and the bootstrap parser both consume this IR. GLL tests construct IR in Go so they do not wait on the bootstrap parser. Surface syntax is docs/xbnf.xbnf; sigils are # for pragmas, . for any-char, unordered |.'
    depends_on:
    - T1
    tags:
    - ir
    - grammar
    origin: docs/plan.md
    discovered: 2026-08-31
  T3:
    name: A bootstrap parser produces IR from xbnf source, including xbnf.xbnf
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - package syntax parses docs/xbnf.xbnf into grammar IR without error
    - The same parser parses docs/examples/json.xbnf and docs/examples/calc.xbnf
    - Tests pin IR shape for those three files (structure, not pretty-print round-trip)
    - python-subset, arrai, and sql-select may remain unparsed if they use unimplemented later features; those skips are named in the test file
    context: Hand-written recursive descent against docs/xbnf.xbnf, not a second grammar language. Once the GLL engine self-hosts, this parser is a bootstrap path, not the spec.
    depends_on:
    - T2
    tags:
    - syntax
    - bootstrap
    origin: docs/plan.md
    discovered: 2026-08-31
  T4:
    name: A GLL engine parses unordered CFGs, including left recursion, from grammar IR
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - Engine consumes grammar.Grammar IR constructed in tests (no dependency on the bootstrap parser)
    - Parses a left-recursive expression grammar and a directly recursive grammar without looping
    - 'Alternation is unordered: swapping alternative order in an unambiguous grammar does not change the parse'
    - On remaining ambiguity after parse, the result is a detectable parse forest / SPPF with packed nodes, not silent first-match
    - 'Scannerless: terminals are strings, character classes, and regex-shaped atoms, not a token stream'
    context: Scott & Johnstone 2010. Native left recursion so Stack is sugar over left-recursive rules, not a distinct engine feature. No PEG ordered choice. Tested against constructed IR so it can land in parallel with T3.
    depends_on:
    - T2
    tags:
    - engine
    - gll
    origin: docs/plan.md §locked-decisions; toward-a-universal-grammar.md §7.1
    discovered: 2026-08-31
  T5:
    name: Regular-fragment rules compile to DFAs and run as the terminal layer
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - A rule whose body is strings, character classes, escapes, alternation, and quantification with no recursive or non-regular references is compiled to a DFA at grammar-compile time
    - A recursive or otherwise non-regular rule is not promoted
    - '#lex on a non-regular rule is a compile error; without #lex, losing regularity is correct but not a DFA'
    - A token-like rule of labelled alternatives (rule::label) uses longest-match as the default disambiguation of that DFA
    - 'Tests cover promotion, non-promotion, and #lex rejection'
    context: 'Regularity is detected, not user-selected. #lex is a strictness lock. This is the fast path that makes scannerless parsing practical on token-shaped grammars without a lexer phase.'
    depends_on:
    - T2
    tags:
    - engine
    - dfa
    origin: docs/plan.md; toward-a-universal-grammar.md §3.2.5 §7.1
    discovered: 2026-08-31
  T6:
    name: Ambiguous grammars fail compilation unless they declare disambiguation
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - A grammar that is not provably deterministic via bounded-lookahead analysis, and that carries no disambiguator on the ambiguous decision, fails at compile time with the decision named
    - 'Supported disambiguators: #prefer, #avoid, #assoc=left|right|none, #priority, #longest'
    - A disambiguator on a decision that is already provably deterministic is a warning, not silence and not an error
    - Source order of alternatives never resolves ambiguity
    - '#longest is the default for rules in the regular fragment (T5) and can be overridden'
    context: No PEG compatibility. Existing wbnf grammars are not a migration set. Ambiguity is never silent.
    depends_on:
    - T4
    tags:
    - disambiguation
    - compiler
    origin: docs/plan.md
    discovered: 2026-08-31
  T7:
    name: The xbnf engine parses xbnf.xbnf, json.xbnf, and calc.xbnf
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - The GLL+DFA engine, given IR from the bootstrap parser, parses docs/xbnf.xbnf completely
    - It parses docs/examples/json.xbnf and uses that grammar to parse a small JSON sample, including nested objects and arrays
    - It parses docs/examples/calc.xbnf and uses that grammar to parse a small expression sample that exercises precedence
    - python-subset, arrai, and sql-select are out of this gate (later features)
    context: Self-hosting join of T3+T4+T5+T6. The language spec is no longer a document the engine cannot read. json and calc are the residue-free example oracles named in docs/plan.md.
    depends_on:
    - T3
    - T4
    - T5
    - T6
    tags:
    - self-host
    - oracle
    origin: docs/plan.md
    discovered: 2026-08-31
  T8:
    name: The CLI parses a grammar file and input, and --explain reports DFA vs GLL promotion
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - xbnf parse <grammar.xbnf> <input> exits 0 on a successful parse and non-zero on failure
    - xbnf --explain <grammar.xbnf> prints which rules were compiled to DFAs and which decision points require GLL forking
    - --version, --help, and --help-agent continue to work; --help-agent still prefixes agents-guide.md with flag help
    - A failed parse reports position and expected terminals or rules, matching the two-layer diagnostic sketch in the design doc
    context: Owner-visible product path. --explain makes the layered engine diagnosable so later performance work has a visible knob rather than an opaque heuristic.
    depends_on:
    - T7
    tags:
    - cli
    - product
    origin: docs/plan.md; toward-a-universal-grammar.md §7.1 diagnostics
    discovered: 2026-08-31
