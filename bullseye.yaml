  T11:
    name: The sandbox syntax reference runs an editable example for every xbnf clause
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'docs/syntax.html plus syntax-clauses.json cover xbnf.xbnf constructs. engine.TestClausesRun executes every core clause (parse+match) and requires later clauses to fail with first-slice in the error. POST /run is the shipped endpoint; Chromium: Run match, edited fail, @col skip, mobile scrollWidth<=392.'
    acceptance:
    - docs/syntax.html is a full syntax reference whose clauses cover the constructs in docs/xbnf.xbnf
    - Each clause has an editable grammar and input; Run sends them to the sandbox /run endpoint and shows a match or error
    - 'A shared clause catalog is executed by Go tests: every first-slice clause parses and matches its default input via the shipped parser and runner'
