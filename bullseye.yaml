    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'Package grammar holds public IR types for every construct in docs/xbnf.xbnf (rules, #lex/#leaf, #wrap/#import/#macro, stack/alt/seq, named, quants including delimited repetition, directives, all atoms). External grammar_test constructs literals and inspects kinds/fields; no parser. No parse functions in the package. make test and make vet green.'
    acceptance:
    - 'Go types in package grammar represent every construct in docs/xbnf.xbnf: rules, modifiers (#lex, #leaf), pragmas (#wrap, #import, #macro), stack/alt/seq, named terms, quantifiers including delimited repetition, directives, atoms (idents, strings, character classes, escapes, leaf /pat/, any-char, refs, extrefs, macros, lookahead, @, positional properties, grouping, empty)'
