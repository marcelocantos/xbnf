  T20:
    name: JSON Parse remaining profile hotspots are cut or discarded with a measurement
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - Each ranked avenue is either kept because BenchmarkJSON64K ns/op, B/op, or allocs/op improved, or discarded with a captured measurement showing it did not pay
    - (1) step log is contiguous per instKey and/or stepAt is not rewritten on every advance; pathScan cands use a stack buffer; 32-step index cutoff is raised or dropped if pathScan is then cheap on JSON spines
    - (2) instIndex is denser, pooled, or gone — not left as map[int][]int plus map[[2]int]bool unless (1) failed to retire it and a denser form also did not pay
    - (3) derive/appendElem do not allocate a fresh []int per node for kid lists, or that change is discarded with a measurement
    - (4) materialize either packs into one backing array with documented read-only Children aliasing, or is left as the API floor with a note that packing was rejected
    - (5) U/sym custom set, firstAtom.describe intern, and skip are tried only after (1)–(4), and kept or discarded the same way
    - Public Node trees still match TestTreeCalcPrecedence, TestTreeAssoc, TestTreePreferAvoidPriority, TestTreeQuantDelimNamed, TestTreeMatchesRecognizer, TestSelfHostTreeShape, TestPooledParseStable
    - Median BenchmarkJSON64K ns/op, B/op, and allocs/op are recorded in docs/parse-speed.md against the 7504667 T19 baseline (22.9 ms / 6.85 MB / 137314 allocs, 3s×5)
    - make test and make vet are green
    context: 'Post-🎯T19 5s BenchmarkJSON64K profile on a23d210 (21.8 ms / 6.85 MB / 137314 allocs). Split is ~50% GLL interpreter and ~31% tree walk. Remaining B/op is ~3.4 MB public Node tree (materialize) plus ~3.5 MB step indexing (instIndex/pathScan/reachable). Chart-slice allocs are already gone. Avenues, ranked: (1) contiguous per-instKey steps and cheaper stepAt (value-map get+put on every advance; pathScan linked-list chase; unmemoised scanReach; stack buf for cands) — if large instances become cheap, raise the 32-step cutoff and drop index; (2) denser or pooled instIndex only if (1) does not retire it; (3) derive/appendElem stop returning fresh []int (arena spans or a scratch stack); (4) packed materialize into one []Node backing array with Children as subslices, only if public trees stay read-only and tests still pass; (5) later/small: U/sym custom set, compile-time intern of firstAtom.describe, skip. Keep only what pays on BenchmarkJSON64K; discard the rest with a captured measurement.'
    tags:
    - engine
    - performance
    origin: manual
    discovered: 2026-09-03
