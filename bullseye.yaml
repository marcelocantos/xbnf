  T8:
    name: The CLI parses a grammar file and input, and --explain reports DFA vs GLL promotion
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'Re-achieved after T7. xbnf parse grammar input exits 0 on json.xbnf + {"a": true} (TestRunParseOK); trailing-comma JSON fails with position and expected terminals (TestRunParseFail); --explain json.xbnf lists DFA vs GLL promotion (TestRunExplain); --help mentions parse/--explain (TestRunHelpMentionsParse). --version/--help/--help-agent unchanged. make test and make vet green.'
    acceptance:
    - xbnf parse <grammar.xbnf> <input> exits 0 on a successful parse and non-zero on failure
    - xbnf --explain <grammar.xbnf> prints which rules were compiled to DFAs and which decision points require GLL forking
    - --version, --help, and --help-agent continue to work; --help-agent still prefixes agents-guide.md with flag help
    - A failed parse reports position and expected terminals or rules, matching the two-layer diagnostic sketch in the design doc
    context: |-
      Owner-visible product path. --explain makes the layered engine diagnosable so later performance work has a visible knob rather than an opaque heuristic.

