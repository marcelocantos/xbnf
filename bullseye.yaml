  T24:
    name: xbnf has a nestable case-folding match mode that applies to any term
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'docs/xbnf.xbnf spells (?i:term) and (?~i:term) around any term. grammar.CaseFold is a match-time mode (ASCII fold on String/CharClass, flattenAt/foldNT for refs). engine/casefold_test.go: TestCaseFoldString SELECT/select, TestCaseFoldSequence mixed-case, TestCaseFoldOffNested Ab not AB/ab, TestCaseFoldClass, TestCaseFoldRef, TestCaseFoldOffOutsideIsNoop, TestUnknownFlagError, TestInvalidUTF8Rejected. fromwbnf Convert emits (?i:) not letter expansion. Cheatsheet + syntax-clauses.json case-fold. SQL keywords use (?i:). make test and make vet green.'
    acceptance:
    - docs/xbnf.xbnf spells (?i:term) as a case-folding match mode around any term (sequences, alts, stacks, strings, classes, refs, /term/, not only regular fragments). Matching inside is case-insensitive. Nested (?~i:term) restores case-sensitive matching for that span. Inner mode wins; regions nest. (?~i:term) outside an (?i:) region is case-sensitive (a no-op, not an error).
    - The engine implements this as a match-time mode flag, not by expanding each letter to a|A at compile. Regular fragments under the mode still compile to DFAs. Unknown (? flag spellings are errors at parse or compile, never silent grouping.
    - 'Tests pin: (?i:"select") matches SELECT and select; (?i:(?~i:"Ab")) matches Ab and not AB or ab; (?i:"select" "from") matches mixed-case sequences; a character class under (?i:) matches the folded letters the spec names. Lookahead (?= / (?! is unchanged.'
    - fromwbnf Convert may emit (?i:) instead of letter expansion once the spelling exists; leftover kind regex-flag remains for flags other than i. Cheatsheet/syntax clauses cover the construct if it is a first-slice atom. make test and make vet stay green.
    - 🎯T22.2 depends on this target and may use (?i:) for SQL keywords. This is not a SQL-specific parser bypass.
    context: (?i:term) and (?~i:term) are unused. Lookahead occupies (?= and (?!; grouping of (? currently dies because ? is not an atom. ~ is not an xbnf sigil, so (?~i:…) does not collide with (?!. fromwbnf Convert still expands (?i:x) to x/X letterwise (TestConvertCaseFold); that is not a match mode and cannot wrap a sequence or be turned off inside. SQL T22.2 is blocked on keyword case-fold; this facility is the general spelling, not a SQL-only bypass. ASCII vs Unicode Simple Case Fold is a spec decision recorded with the construct; SQL keywords only need ASCII.
    tags:
    - engine
    - syntax
    - casefold
    origin: 'User request 2026-09-06: case-insensitive modifier as a mode on any term, with an inner off-switch; SQL T22.2 depends on it'
