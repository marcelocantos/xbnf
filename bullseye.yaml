    - No parse functions live in this package
    context: |-
      The engine and the bootstrap parser both consume this IR. GLL tests construct IR in Go so they do not wait on the bootstrap parser. Surface syntax is docs/xbnf.xbnf; sigils are # for pragmas, . for any-char, unordered |.

      Achieved 2026-08-31: Package grammar holds public IR types for every construct in docs/xbnf.xbnf (rules, #lex/#leaf, #wrap/#import/#macro, stack/alt/seq, named, quants including delimited repetition, directives, all atoms). External grammar_test constructs literals and inspects kinds/fields; no parser. No parse functions in the package. make test and make vet green.
