  T4:
    name: A GLL engine parses unordered CFGs, including left recursion, from grammar IR
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: engine.Parse compiles constructed grammar.Grammar IR and runs GLL. TestGLLLeftRecursiveExpr parses 1+1+1; TestGLLDirectRecursion parses ((x)); TestGLLUnorderedAlt is order-invariant; TestGLLPackedForest reports packed>0 (not silent first-match). Terminals are strings/classes/leaf atoms. make test and make vet green.
    acceptance:
    - Engine consumes grammar.Grammar IR constructed in tests (no dependency on the bootstrap parser)
    - Parses a left-recursive expression grammar and a directly recursive grammar without looping
    - 'Alternation is unordered: swapping alternative order in an unambiguous grammar does not change the parse'
    - On remaining ambiguity after parse, the result is a detectable parse forest / SPPF with packed nodes, not silent first-match
    - 'Scannerless: terminals are strings, character classes, and regex-shaped atoms, not a token stream'
    context: |-
      Scott & Johnstone 2010. Native left recursion so Stack is sugar over left-recursive rules, not a distinct engine feature. No PEG ordered choice. Tested against constructed IR so it can land in parallel with T3.

      Achieved 2026-08-31: engine.Parse compiles constructed grammar.Grammar IR and runs GLL. TestGLLLeftRecursiveExpr parses 1+1+1; TestGLLDirectRecursion parses ((x)); TestGLLUnorderedAlt is order-invariant; TestGLLPackedForest reports packed>0 (not silent first-match). Terminals are strings/classes/leaf atoms. make test and make vet green.
    depends_on:
    - T2
    tags:
