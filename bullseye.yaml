  T12:
    name: xbnf parses .wbnf source into an IR of what the grammar means
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: fromwbnf.Parse reads .wbnf into a public IR of productions, terms, pragmas, and macros (macros kept, no cut-points). TestIsomorphicToWbnfParser diffs stripCuts(wbnf.NewFromAst) against that IR on testdata copies of arr-ai/wbnf xml.wbnf, balancedbraces.wbnf, wbnf.wbnf, and indents.wbnf. Shape tests pin wrapRE, stack, delim, refs, scoped pragma. The IR is not executed as a parser. make test and make vet green.
    acceptance:
    - fromwbnf.Parse reads a .wbnf file into a public IR of productions, terms, pragmas, and macros
    - The IR is isomorphic to the wbnf parser's grammar AST (same names, combinators, terminals, wrapRE), not the same Go types and not cut-points
    - Tests parse examples/wbnf.wbnf and at least xml.wbnf and balancedbraces.wbnf from arr-ai/wbnf and check IR shape against the wbnf parser
    - The IR is not executed as a parser
    context: |-
      Owner wants to convert old wbnf grammars to xbnf. First stage: parse wbnf into a data structure of meaning. Conversion to xbnf source is T13. Do not require running the grammar or matching wbnf's in-memory Go objects.

      Achieved 2026-08-31: fromwbnf.Parse reads .wbnf into a public IR of productions, terms, pragmas, and macros (macros kept, no cut-points). TestIsomorphicToWbnfParser diffs stripCuts(wbnf.NewFromAst) against that IR on testdata copies of arr-ai/wbnf xml.wbnf, balancedbraces.wbnf, wbnf.wbnf, and indents.wbnf. Shape tests pin wrapRE, stack, delim, refs, scoped pragma. The IR is not executed as a parser. make test and make vet green.
    depends_on:
    - T3
    tags:
    - wbnf
    - convert
    origin: user
    discovered: 2026-08-31
    achieved: 2026-08-31
