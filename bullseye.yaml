    - 'DFA-path Quant and Delim insert #wrap between repetitions and around separators, matching the GLL path (`s -> "a"+ ; #wrap -> \s* ;` accepts "a a a"); the GLL delimNT trailing separator is optional, matching the DFA path'
    context: 'Evaluation 2026-09-02: unknown identifiers compile to ε in DFA context (dfa.go:221) and to a production-less nonterminal in GLL context; `a -> b "x"` parses "x" OK. scopeNT (compile.go:520) never builds DFAs for local regular rules, so flatten emits ekDFA for a nil DFA and process drops the path silently; it also restores c.rules so the tree builder cannot find the local rule. checkAlt reads directives from the enclosing sequence only, so the natural `E -> E "-" E #assoc=left | T` spelling is rejected as ambiguous.'
    tags:
