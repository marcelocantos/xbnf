  T18:
    name: Parse tree construction is linear on repetition and delimited lists
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'leftRecKids walks transparent left-recursive $dl/$qs once and joinSpine concatenates in one slice (tree.go). TestTreeAssoc still nests (1-2)-3 / 1-(2-3). TestTreeCalcPrecedence, TestTreeQuantDelimNamed, TestSelfHostTreeShape, TestListDescriptorsLinear green. TestTreeBuildLinearAlloc: nested JSON allocs 4 KB->16 KB within 6x. BenchmarkJSON64K: 51–55 ms/op, 1.18–1.28 MB/s, 95 MB/op (was 73–120 ms, 581 MB/op). JSON wall-clock 4/16/64/256 KB: 3.0 / 10.9 / 45.6 / 229 ms (×5.02 for 4x at 256 KB, was ×8.16 / 789 ms). make test and make vet green.'
    acceptance:
    - Transparent left-recursive synthetics ($dl, $qs) assemble children in one O(n) pass; they do not append the prefix at every spine node
    - 'User-level left recursion still nests: TestTreeAssoc 1-2-3 remains (1-2)-3 / 1-(2-3)'
    - TestTreeCalcPrecedence, TestTreeQuantDelimNamed, TestSelfHostTreeShape, and TestListDescriptorsLinear stay green
    - BenchmarkJSON64K is under 100 ms and under 100 MB/op on the dev machine (was 73–120 ms, 581 MB/op)
    - A test asserts Parse allocs on nested JSON grow by at most 6x when input grows 4x (4 KB -> 16 KB)
