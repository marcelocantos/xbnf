    attestation: 'fromwbnf.Convert emits xbnf: wbnf | becomes |>, .wrapRE becomes #wrap, regex terminals become /term/. TestConvertCorpus syntax.Parse of xml.wbnf, balancedbraces.wbnf, wbnf.wbnf, indents.wbnf conversions. TestConvertNamesUntranslatable names unicode-property rather than dropping it. xbnf from-wbnf writes the result. make test and make vet green.'
