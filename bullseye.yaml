  T15:
    name: GLL parse time is linear on repetition and delimited lists
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'quantNT/delimNT emit left-recursive loops (compile.go); add() applies a FIRST test from slotFirst computed in first.go; skipWrap memoised per position. engine.TestListDescriptorsLinear asserts descriptor growth <= 5x per 4x input on flat and nested JSON at 1/4/16 KB (passes). BenchmarkJSON64K: 27.8 ms/op, 2.36 MB/s, 43 MB/op (was 1.34 s, 1.29 GB/op). make test and go vet green; TestSelfHost* and TestClausesRun unchanged.'
    acceptance:
    - Quantifiers (*, +, {n,m}) and delimited lists (x:sep) compile to left-recursive loops, not right-recursive tails
    - Descriptor creation applies a FIRST/FOLLOW test so ε-completions are not enqueued when the next character cannot follow
    - An engine test parses flat JSON arrays at 1 KB, 4 KB, and 16 KB and asserts processed descriptor count grows by at most 5x per 4x input
    - A Go benchmark BenchmarkJSON64K exists and 64 KB of JSON parses in under 100 ms on the dev machine (was 1.34 s)
    - All existing engine tests, TestSelfHost*, and make test stay green
    context: 'Evaluation 2026-09-02: JSON parse time grows ~n^2.2 (4 KB 6 ms, 64 KB 1.34 s, 256 KB 30 s). Instrumentation on a flat 16 KB array showed 5.6M descriptors and 5.6M completions with one GSS node collecting 3349 pops. Cause: quantNT/delimNT emit `tail ::= ε | inner tail` and `add` never tests whether the upcoming input can follow, so every list tail completes at every later element boundary. DFA layer is below 1% of the profile; the blowout is in the GLL skeleton. Standard GLL test sets or left-recursive loops make this linear.'
    tags:
    - engine
    - performance
    origin: 2026-09-02 quality/performance evaluation
    discovered: 2026-09-02
    achieved: 2026-09-02
  T16:
    name: Parse trees are derived from the GLL parse and disambiguators select among competing derivations
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'GLL records per-element steps; builder.derive walks those plus prodDirs (#prefer/#avoid/#priority/#assoc) instead of the old greedy buildTree. TestTreeCalcPrecedence: calc 1+2*3 nests * inside +; 1-2-3 is a flat additive delim (packed=0). TestTreeAssoc: #assoc=left (1-2)-3, right 1-(2-3), none rejects a chain. TestTreePreferAvoidPriority and TestTreeMatchesRecognizer pin disambiguation and non-greedy choice. TestSelfHostTreeShape: xbnf.xbnf tree has one stmt per bootstrap production. Residue: twalk remains only to recover structure inside a DFA span (TestTreeQuantDelimNamed). Stack infix @:sep requires a separator so @:op="?" @:op=":" cannot juxtapose a term with unary -N. make test and make vet green.'
    acceptance:
    - engine.Result.Tree is built from derivations recorded during the GLL parse, not from a separate greedy walk; the greedy twalk is removed
    - 'A stack grammar yields structured trees: calc.xbnf on 1+2*3 produces a tree whose multiplication node is nested inside the addition node, asserted by test'
    - '#assoc=left on a level makes 1-2-3 parse as (1-2)-3 and #assoc=right as 1-(2-3), asserted by test'
    - '#prefer/#avoid on an alternative and #priority=N choose among derivations of the same span, asserted by tests'
    - When derivations remain ambiguous after disambiguation, Result.Packed counts them and the tree takes one deterministically; Result.OK never pairs with a tree that fails to reflect the parse
    - TestSelfHost* assert tree shape (at least the top-level statement count of xbnf.xbnf), not only OK
    context: 'Evaluation 2026-09-02: engine/tree.go is a second, greedy, non-backtracking parser that ignores the GLL result. It has no Self case, so every stack grammar yields a flat leaf (calc on 1+2*3 gives expr:"1+2*3"). When it fails it silently returns the whole input as one node with OK still true. Disambiguation directives appear only in the static checker (disambig.go) and are never applied at runtime; calc on 1-2-3 reports 34 packed nodes. Semantics chosen: #prefer/#avoid mark an alternative winner/loser against siblings for the same span; #priority=N higher wins; #assoc=left makes a right-nested self-reference lose to a left-nested one, right the reverse, none makes a chain an error.'
    tags:
    - engine
    - correctness
    origin: 2026-09-02 quality/performance evaluation
    discovered: 2026-09-02
    achieved: 2026-09-02
  T17:
    name: Grammar compile rejects undefined rule references and executes scoped local rules correctly
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'engine/t17_test.go: TestUndefinedRefDFA/GLL name b; TestScopedLocalRegularInCFG NUM nodes; TestInnerAssocSatisfiesAmbiguity; TestDFAQuantInsertsWrap and TestGLLQuantInsertsWrap accept "a a a"; TestDelimWrapAndOptionalTrailing DFA/GLL agree. scopeNT builds local DFAs; checkDefined walks Idents. make test and make vet green.'
    acceptance:
    - Compile of `a -> b "x" ;` with no rule b returns an error naming b; both the DFA path (dfa.go Ident case) and the GLL path (flatten) are covered by test
    - A scoped local regular rule used from a non-regular body (`a -> { NUM -> /[0-9]+/ ; NUM ("+" a)* ; }`) parses and produces a tree containing NUM nodes
    - scopeNT dead code (no-op closure and empty if blocks) is removed
    - '#assoc/#prefer written on an inner alternative sequence (`E -> E "-" E #assoc=left | T`) satisfies the ambiguity check'
    - 'DFA-path Quant and Delim insert #wrap between repetitions and around separators, matching the GLL path (`s -> "a"+ ; #wrap -> \s* ;` accepts "a a a"); the GLL delimNT trailing separator is optional, matching the DFA path'
    context: 'Evaluation 2026-09-02: unknown identifiers compile to ε in DFA context (dfa.go:221) and to a production-less nonterminal in GLL context; `a -> b "x"` parses "x" OK. scopeNT (compile.go:520) never builds DFAs for local regular rules, so flatten emits ekDFA for a nil DFA and process drops the path silently; it also restores c.rules so the tree builder cannot find the local rule. checkAlt reads directives from the enclosing sequence only, so the natural `E -> E "-" E #assoc=left | T` spelling is rejected as ambiguous.'
    tags:
