  T5:
    name: Regular-fragment rules compile to DFAs and run as the terminal layer
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'Compile promotes regular N to a DFA (TestDFARegularPromoted) and not recursive E (TestDFARecursiveNotPromoted). #lex on left-rec E is a compile error (TestLexNonRegularError); without #lex GLL still parses (TestNonRegularWithoutLexStillParses). tok::kw longest-match: if wins, ifx loses to ident, tok::kw then x does not steal the if prefix (TestLabelLongestMatch). make test and make vet green.'
    acceptance:
    - A rule whose body is strings, character classes, escapes, alternation, and quantification with no recursive or non-regular references is compiled to a DFA at grammar-compile time
    - A recursive or otherwise non-regular rule is not promoted
    - '#lex on a non-regular rule is a compile error; without #lex, losing regularity is correct but not a DFA'
    - A token-like rule of labelled alternatives (rule::label) uses longest-match as the default disambiguation of that DFA
    - 'Tests cover promotion, non-promotion, and #lex rejection'
    context: |-
      Regularity is detected, not user-selected. #lex is a strictness lock. This is the fast path that makes scannerless parsing practical on token-shaped grammars without a lexer phase.

      Achieved 2026-08-31: Compile promotes regular N to a DFA (TestDFARegularPromoted) and not recursive E (TestDFARecursiveNotPromoted). #lex on left-rec E is a compile error (TestLexNonRegularError); without #lex GLL still parses (TestNonRegularWithoutLexStillParses). tok::kw longest-match: if wins, ifx loses to ident, tok::kw then x does not steal the if prefix (TestLabelLongestMatch). make test and make vet green.
    depends_on:
    - T2
    tags:
    - engine
    - dfa
    origin: docs/plan.md; toward-a-universal-grammar.md §3.2.5 §7.1
    discovered: 2026-08-31
    achieved: 2026-08-31
  T6:
    name: Ambiguous grammars fail compilation unless they declare disambiguation
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'Compile-time disambiguation in engine.Compile: overlapping unordered | without a disambiguator is a named error (TestAmbiguousAltCompileError, TestPrefixAltsInCFGError); #prefer/#avoid/#assoc/#priority/#longest allow overlap (TestDisambiguatorsAllowOverlap); disjoint | with a disambiguator is a warning (TestUnnecessaryDisambiguationWarning); | source order does not resolve; regular-fragment rules keep implicit #longest (TestRegularOverlapNoError, TestRegularDuplicateStringsCompile); bounded lookahead peels shared string/regular-ident prefixes (TestGroupEmptyLL2, TestSharedIdentPrefixLL2). |> is committed choice. make test and make vet green.'
    acceptance:
    - A grammar that is not provably deterministic via bounded-lookahead analysis, and that carries no disambiguator on the ambiguous decision, fails at compile time with the decision named
    - 'Supported disambiguators: #prefer, #avoid, #assoc=left|right|none, #priority, #longest'
    - A disambiguator on a decision that is already provably deterministic is a warning, not silence and not an error
    - Source order of alternatives never resolves ambiguity
    - '#longest is the default for rules in the regular fragment (T5) and can be overridden'
    context: No PEG compatibility. Existing wbnf grammars are not a migration set. Ambiguity is never silent.
    depends_on:
    - T4
    tags:
    - disambiguation
    - compiler
    origin: docs/plan.md
    discovered: 2026-08-31
    achieved: 2026-09-01
