; xbnf sandbox (cheat sheet + syntax reference + POST /run).
; Template: supervisor/install.sh writes supervisor.d/xbnf-sandbox.ini with @REPO@ expanded.
; Bind/port match the standing local sandbox (not the CLI default 127.0.0.1:7373).

[program:xbnf-sandbox]
command=@REPO@/supervisor/run-sandbox.sh
directory=@REPO@
environment=HOME="%(ENV_HOME)s",USER="%(ENV_USER)s",PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:%(ENV_HOME)s/.cargo/bin:%(ENV_HOME)s/.local/bin:%(ENV_HOME)s/.py/bin:%(ENV_HOME)s/go/bin:/usr/bin:/bin:/usr/sbin:/sbin",XBNF_SANDBOX_BIND="0.0.0.0",XBNF_SANDBOX_PORT="8878"
autostart=true
autorestart=true
startsecs=1
stopwaitsecs=10
stdout_logfile=%(ENV_HOME)s/.local/var/log/xbnf-sandbox.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
